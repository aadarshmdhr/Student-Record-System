<h1>Student Record System</h1>

<a href="">
    <button>Add Student</button>
</a>

{% for student in students %}

<p>{{ student.name }}</p>
<p>{{ student.age }}</p>
<p>{{ student.email }}</p>

<a href="">
    <button>Edit</button>
</a>

<a href="delete/{{ student.pk }}/">
    <button>Delete</button>
</a>
{% endfor %}
