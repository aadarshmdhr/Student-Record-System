{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

        <div class="card student-form-card border-0 shadow-lg">

            <!-- Header -->
            <div class="card-header form-header text-center border-0 py-4">
                <div class="form-icon">
                    <i class="bi bi-person-plus-fill"></i>
                </div>

                <h2 class="fw-bold mt-3 mb-1">Create Student</h2>
                <p class="mb-0 text-white-50">
                    Add a new student to the system
                </p>
            </div>

            <!-- Form -->
            <div class="card-body p-4 p-md-5">

                <form method="POST">

                    {% csrf_token %}

                    <!-- Name -->
                    <div class="mb-4">
                        <label for="name" class="form-label fw-semibold">
                            <i class="bi bi-person me-1"></i>
                            Full Name
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input type="text" id="name" name="name" class="form-control"
                                placeholder="Enter student's full name" required>
                        </div>
                    </div>

                    <!-- Age -->
                    <div class="mb-4">
                        <label for="age" class="form-label fw-semibold">
                            <i class="bi bi-calendar3 me-1"></i>
                            Age
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-calendar3"></i>
                            </span>

                            <input type="number" id="age" name="age" class="form-control"
                                placeholder="Enter student's age" min="1" max="120" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold">
                            <i class="bi bi-envelope me-1"></i>
                            Email Address
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input type="email" id="email" name="email" class="form-control"
                                placeholder="Enter student's email" required>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg create-btn">
                            <i class="bi bi-person-plus-fill me-2"></i>
                            Create Student
                        </button>
                    </div>

                </form>

            </div>

            <!-- Footer -->
            <div class="card-footer bg-light border-0 text-center py-3">
                <small class="text-muted">
                    <i class="bi bi-shield-check me-1"></i>
                    Student information is securely stored.
                </small>
            </div>

        </div>

    </div>
</div>

{% endblock %}
