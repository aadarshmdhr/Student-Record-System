<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>
    ```html
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card student-form-card border-0 shadow-lg">

                    <!-- Header -->
                    <div class="card-header form-header text-center border-0 py-4">

                        <div class="form-icon">
                            <i class="bi bi-pencil-square"></i>
                        </div>

                        <h2 class="fw-bold mt-3 mb-1">
                            Update Student
                        </h2>

                        <p class="mb-0 text-white-50">
                            Update {{ student.name }}'s information
                        </p>

                    </div>


                    <!-- Form -->
                    <div class="card-body p-4 p-md-5">

                        <form method="POST">

                            {% csrf_token %}


                            <!-- Name -->
                            <div class="mb-4">

                                <label for="name" class="form-label fw-semibold">
                                    <i class="bi bi-person me-1"></i>
                                    Full Name
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>

                                    <input type="text" id="name" name="name" value="{{ student.name }}"
                                        class="form-control" placeholder="Enter student's full name" required>

                                </div>

                            </div>


                            <!-- Age -->
                            <div class="mb-4">

                                <label for="age" class="form-label fw-semibold">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    Age
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-calendar3"></i>
                                    </span>

                                    <input type="number" id="age" name="age" value="{{ student.age }}"
                                        class="form-control" placeholder="Enter student's age" min="1" max="120"
                                        required>

                                </div>

                            </div>


                            <!-- Email -->
                            <div class="mb-4">

                                <label for="email" class="form-label fw-semibold">
                                    <i class="bi bi-envelope me-1"></i>
                                    Email Address
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-envelope"></i>
                                    </span>

                                    <input type="email" id="email" name="email" value="{{ student.email }}"
                                        class="form-control" placeholder="Enter student's email" required>

                                </div>

                            </div>


                            <!-- Buttons -->
                            <div class="row g-2 mt-4">

                                <div class="col-sm-6">
                                    <button type="submit" class="btn btn-primary btn-lg w-100 update-btn">
                                        <i class="bi bi-check-circle-fill me-2"></i>
                                        Update Student
                                    </button>
                                </div>

                                <div class="col-sm-6">
                                    <a href="/" class="btn btn-outline-secondary btn-lg w-100 cancel-btn">
                                        <i class="bi bi-arrow-left me-2"></i>
                                        Cancel
                                    </a>
                                </div>

                            </div>

                        </form>

                    </div>


                    <!-- Footer -->
                    <div class="card-footer bg-light border-0 text-center py-3">

                        <small class="text-muted">
                            <i class="bi bi-info-circle me-1"></i>
                            Make sure the student information is correct.
                        </small>

                    </div>

                </div>

            </div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    ```

</body>

</html>
